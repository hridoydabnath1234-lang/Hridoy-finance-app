<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>HRIDOYS JOURNAL</title>
  
  <!-- PWA & Logo Integration -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <meta name="theme-color" content="#4f46e5">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f3f4f6;
      color: #1f2937;
      
      /* Mobile edge-to-edge / Viewport cover */
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    /* Container without max-width constraint for full screen fit */
    .app-container {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: #4f46e5;
      color: white;
      padding: 1.2rem 1rem;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    header h1 {
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    main {
      flex: 1;
      padding: 1rem;
    }

    .card {
      background: white;
      padding: 1.5rem;
      border-radius: 16px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
      margin-bottom: 1rem;
    }

    .card h2 {
      font-size: 1.1rem;
      color: #374151;
      margin-bottom: 0.5rem;
    }

    .card p {
      color: #6b7280;
      font-size: 0.95rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <h1>HRIDOYS JOURNAL</h1>
    </header>

    <main>
      <div class="card">
        <h2>My Finance Dashbaord</h2>
        <p>আপনার ড্যাশবোর্ড ও অ্যাপের হিসাবের মডিউলগুলো সফলভাবে লোড হয়েছে।</p>
      </div>
    </main>
  </div>

  <script>
    // Register Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker Active'))
          .catch(err => console.log('SW Registration Failed:', err));
      });
    }
  </script>
</body>
</html>
